<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">ThesisAgent 系统架构图</title>
  <desc id="desc">展示 ThesisAgent 从用户界面、Agent 控制器、模型 API、安全控制层、工具层到数据、记忆和安全实验的完整架构。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17324d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#55708c"/>
    </marker>
    <marker id="arrowLight" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#ffffff"/>
    </marker>
    <style>
      .font { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif; fill: #17324d; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #55708c; }
      .section { font-size: 22px; font-weight: 700; }
      .card-title { font-size: 22px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 15px; fill: #55708c; }
      .chip { font-size: 15px; font-weight: 600; }
      .line { stroke: #55708c; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .line-dashed { stroke: #8da2b5; stroke-width: 2.5; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="#f5f8fc"/>
  <circle cx="1450" cy="90" r="180" fill="#e7f1fb" opacity="0.7"/>
  <circle cx="100" cy="1010" r="210" fill="#edf5f2" opacity="0.7"/>

  <text x="80" y="70" class="font title">ThesisAgent 系统架构</text>
  <text x="80" y="103" class="font subtitle">模型负责理解与规划 · 程序负责权限与执行 · 日志负责审计与复盘</text>

  <rect x="80" y="135" width="1440" height="135" rx="22" fill="#e8f3ff" stroke="#76aee2" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="174" class="font section">用户接口层</text>
  <text x="120" y="203" class="font small">用户通过终端或网页提交问题、上传资料并查看工具调用过程</text>
  <rect x="120" y="220" width="360" height="34" rx="17" fill="#ffffff" stroke="#9dc7eb"/>
  <text x="300" y="243" text-anchor="middle" class="font chip">main.py · 终端界面</text>
  <rect x="510" y="220" width="430" height="34" rx="17" fill="#ffffff" stroke="#9dc7eb"/>
  <text x="725" y="243" text-anchor="middle" class="font chip">app.py · Streamlit 网页界面</text>
  <rect x="970" y="220" width="470" height="34" rx="17" fill="#ffffff" stroke="#9dc7eb"/>
  <text x="1205" y="243" text-anchor="middle" class="font chip">文件上传 · 对话历史 · 工具调用展示</text>

  <path d="M 800 270 L 800 315" class="line"/>

  <rect x="250" y="315" width="1100" height="165" rx="24" fill="#ffffff" stroke="#9dc7eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="355" text-anchor="middle" fill="#ffffff" class="font section">Agent 控制器 · agent.py</text>
  <text x="800" y="386" text-anchor="middle" fill="#d9e8f5" class="font body">接收消息 → 调用模型 → 解析工具请求 → 执行工具 → 返回结果 → 生成答案</text>
  <rect x="310" y="415" width="210" height="36" rx="18" fill="#e8f3ff" stroke="#9dc7eb"/>
  <text x="415" y="439" text-anchor="middle" fill="#ffffff" class="font chip">系统提示词</text>
  <rect x="545" y="415" width="210" height="36" rx="18" fill="#e8f3ff" stroke="#9dc7eb"/>
  <text x="650" y="439" text-anchor="middle" fill="#ffffff" class="font chip">工具 Schema</text>
  <rect x="780" y="415" width="210" height="36" rx="18" fill="#e8f3ff" stroke="#9dc7eb"/>
  <text x="885" y="439" text-anchor="middle" fill="#ffffff" class="font chip">API 调用</text>
  <rect x="1015" y="415" width="250" height="36" rx="18" fill="#e8f3ff" stroke="#9dc7eb"/>
  <text x="1140" y="439" text-anchor="middle" fill="#ffffff" class="font chip">工具调用循环</text>

  <path d="M 585 480 L 420 555" class="line"/>
  <path d="M 1015 480 L 1180 555" class="line"/>

  <rect x="120" y="555" width="600" height="130" rx="22" fill="#f0eafe" stroke="#a98ce8" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="170" cy="605" r="25" fill="#8b68d1"/>
  <text x="170" y="613" text-anchor="middle" fill="#ffffff" class="font card-title">AI</text>
  <text x="220" y="596" class="font card-title">OpenAI 兼容模型 API</text>
  <text x="220" y="626" class="font body">理解用户意图、规划动作、选择工具</text>
  <text x="220" y="653" class="font small">OpenAI SDK · DeepSeek 兼容接口 · Chat Completions</text>

  <rect x="880" y="555" width="600" height="130" rx="22" fill="#fff1df" stroke="#e3a85f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="930" cy="605" r="25" fill="#d8892f"/>
  <path d="M 918 605 L 927 614 L 944 594" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="980" y="596" class="font card-title">安全控制层 · security_controls.py</text>
  <text x="980" y="626" class="font body">工具白名单、参数校验、路径限制、调用限额</text>
  <text x="980" y="653" class="font small">输出脱敏 · 输出截断 · 审计日志 · 资源边界</text>

  <path d="M 420 685 L 420 720" class="line"/>
  <path d="M 1180 685 L 1180 720" class="line"/>

  <rect x="80" y="720" width="1440" height="175" rx="22" fill="#e9f7f1" stroke="#76c5a6" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="758" class="font section">工具执行层</text>
  <text x="120" y="785" class="font small">模型只能提出工具请求，工具执行前必须经过本地安全校验</text>

  <rect x="120" y="810" width="300" height="58" rx="14" fill="#ffffff" stroke="#a7d9c2"/>
  <text x="270" y="835" text-anchor="middle" class="font card-title">calculate</text>
  <text x="270" y="857" text-anchor="middle" class="font small">AST 白名单数学计算</text>
  <rect x="450" y="810" width="300" height="58" rx="14" fill="#ffffff" stroke="#a7d9c2"/>
  <text x="600" y="835" text-anchor="middle" class="font card-title">get_current_time</text>
  <text x="600" y="857" text-anchor="middle" class="font small">读取本机当前时间</text>
  <rect x="780" y="810" width="300" height="58" rx="14" fill="#ffffff" stroke="#a7d9c2"/>
  <text x="930" y="835" text-anchor="middle" class="font card-title">read_text_file</text>
  <text x="930" y="857" text-anchor="middle" class="font small">读取受限 data/ 文件</text>
  <rect x="1110" y="810" width="300" height="58" rx="14" fill="#ffffff" stroke="#a7d9c2"/>
  <text x="1260" y="835" text-anchor="middle" class="font card-title">search_knowledge_base</text>
  <text x="1260" y="857" text-anchor="middle" class="font small">检索本地知识库</text>

  <path d="M 270 895 L 270 940" class="line-dashed"/>
  <path d="M 930 895 L 930 940" class="line-dashed"/>
  <path d="M 1260 895 L 1260 940" class="line-dashed"/>

  <rect x="80" y="940" width="330" height="115" rx="20" fill="#ffffff" stroke="#b8c8d7" stroke-width="2" filter="url(#shadow)"/>
  <text x="245" y="980" text-anchor="middle" class="font card-title">data/</text>
  <text x="245" y="1010" text-anchor="middle" class="font body">受限文件目录</text>
  <text x="245" y="1035" text-anchor="middle" class="font small">TXT · MD · CSV · JSON</text>

  <rect x="450" y="940" width="560" height="115" rx="20" fill="#ffffff" stroke="#b8c8d7" stroke-width="2" filter="url(#shadow)"/>
  <text x="730" y="980" text-anchor="middle" class="font card-title">knowledge/ · 本地知识库</text>
  <text x="730" y="1010" text-anchor="middle" class="font body">PDF / Word / Markdown / TXT</text>
  <text x="730" y="1035" text-anchor="middle" class="font small">文本切片 → TF-IDF → 余弦相似度 → Top-k 片段</text>

  <rect x="1050" y="940" width="220" height="115" rx="20" fill="#ffffff" stroke="#b8c8d7" stroke-width="2" filter="url(#shadow)"/>
  <text x="1160" y="980" text-anchor="middle" class="font card-title">memory.py</text>
  <text x="1160" y="1010" text-anchor="middle" class="font body">SQLite 记忆</text>
  <text x="1160" y="1035" text-anchor="middle" class="font small">用户/会话隔离</text>

  <rect x="1310" y="940" width="210" height="115" rx="20" fill="#ffffff" stroke="#b8c8d7" stroke-width="2" filter="url(#shadow)"/>
  <text x="1415" y="980" text-anchor="middle" class="font card-title">security_lab/</text>
  <text x="1415" y="1010" text-anchor="middle" class="font body">测试与评估</text>
  <text x="1415" y="1035" text-anchor="middle" class="font small">攻击用例 · 审计</text>

  <path d="M 800 480 L 800 515" stroke="#55708c" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <rect x="640" y="495" width="320" height="34" rx="17" fill="#ffffff" stroke="#b8c8d7"/>
  <text x="800" y="518" text-anchor="middle" class="font chip">模型决策必须经过程序边界</text>
</svg>
